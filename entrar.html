<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <script>
      document.documentElement.setAttribute("data-theme", "dark");
    </script>
    <meta name="robots" content="noindex" />
    <meta name="description" content="Acesso à plataforma da WATERCATSGG." />
    <title>Entrar | WATERCATSGG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Russo+One&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/hub-theme.css" />
    <link rel="stylesheet" href="/css/hub-chrome.css" />
    <link rel="stylesheet" href="/css/org.css" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body class="hub-site page-entrar">
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <header data-header></header>
    <main id="conteudo" class="container">
      <form class="ep-login" id="login-form">
        <h1>Entrar</h1>
        <p>Acesso à plataforma da organização. Informe usuário e senha.</p>
        <label for="login-user">Usuário</label>
        <input id="login-user" name="username" autocomplete="username" required autofocus />
        <label for="login-pass">Senha</label>
        <input id="login-pass" name="password" type="password" autocomplete="current-password" required />
        <button class="btn btn--primary" type="submit">Entrar</button>
        <p id="login-msg" class="ep-msg" role="status"></p>
      </form>
    </main>
    <footer data-footer></footer>
    <script src="/js/main.js" defer></script>
    <script src="/js/entrar.js" defer></script>
  </body>
</html>
