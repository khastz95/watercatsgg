<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071018" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ep-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <meta name="robots" content="noindex" />
    <title>Entrar | Eternal Pratas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/hub-theme.css" />
    <link rel="stylesheet" href="/css/hub-chrome.css" />
    <link rel="stylesheet" href="/css/org.css" />
    <link rel="icon" href="/assets/logo.png" type="image/png" />
  </head>
  <body class="hub-site page-entrar">
    <header data-header></header>
    <main class="container">
      <form class="ep-login" id="login-form">
        <h1>Entrar</h1>
        <p>Usuário e senha.</p>
        <label for="login-user">Usuário</label>
        <input id="login-user" name="username" autocomplete="username" required />
        <label for="login-pass">Senha</label>
        <input id="login-pass" name="password" type="password" autocomplete="current-password" required />
        <button class="btn btn--primary" type="submit">Entrar</button>
        <p id="login-msg" class="ep-msg"></p>
      </form>
    </main>
    <footer data-footer></footer>
    <script src="/js/main.js" defer></script>
    <script src="/js/entrar.js" defer></script>
  </body>
</html>
