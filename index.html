<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071018" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Eternal Pratas — time closed de Counter-Strike 2. Elenco e campeonato 1v1." />
    <title>Eternal Pratas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/hub-theme.css" />
    <link rel="stylesheet" href="/css/hub-chrome.css" />
    <link rel="stylesheet" href="/css/team.css" />
    <link rel="icon" href="/assets/logo.png" type="image/png" />
  </head>
  <body class="hub-site page-home">
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">
          <img class="brand__logo" src="/assets/logo.png" alt="Logo Eternal Pratas" width="44" height="44" />
          <span class="brand__text">
            <span class="brand__name"><span>ETERNAL</span><span>PRATAS</span></span>
          </span>
        </a>
        <button class="nav-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="main-nav">
          <span></span><span></span><span></span>
        </button>
        <nav class="site-nav" id="main-nav" aria-label="Principal">
          <ul>
            <li><a href="/" data-nav="home">Início</a></li>
            <li><a href="/jogadores" data-nav="elenco">Elenco</a></li>
            <li><a href="/1v1" data-nav="1v1">1v1</a></li>
            <li><a href="/sobre" data-nav="sobre">Sobre</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="team-hero reveal">
        <p class="team-hero__kicker">Counter-Strike 2 · Closed</p>
        <h1>Eternal Pratas</h1>
        <p>Time fechado. Aqui está o elenco e o campeonato 1v1 — sem fila, sem mix aberto.</p>
        <div class="team-hero__actions">
          <a class="btn btn--primary" href="/1v1">Campeonato 1v1</a>
          <a class="btn btn--ghost" href="/jogadores">Ver elenco</a>
        </div>
      </section>

      <section class="section section--tight">
        <div class="section__head reveal">
          <div>
            <p class="section__label">Elenco</p>
            <h2>Os cinco</h2>
          </div>
        </div>
        <div id="team-roster" class="team-roster" aria-live="polite"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer__shell">
        <div class="footer__grid">
          <a href="/" class="footer__brandmark">
            <img src="/assets/logo.png" alt="" width="32" height="32" class="footer__logo" />
            <span class="footer__brandname">ETERNAL PRATAS</span>
          </a>
          <div class="footer__social">
            <a class="footer__social-link" href="https://discord.gg/et6N2Y3pJj" target="_blank" rel="noopener noreferrer">Discord</a>
            <a class="footer__social-link" href="https://steamcommunity.com/groups/eternalpratas" target="_blank" rel="noopener noreferrer">Steam</a>
          </div>
        </div>
        <div class="footer__bottom">
          <p class="footer__copy">© <span id="year"></span> Eternal Pratas</p>
        </div>
      </div>
    </footer>

    <script src="/js/main.js" defer></script>
    <script src="/js/elenco.js" defer></script>
  </body>
</html>
