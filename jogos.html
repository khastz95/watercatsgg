<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071018" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ep-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Jogos da Eternal Pratas — agenda, resultados e escalação." />
    <title>Jogos | Eternal Pratas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/hub-theme.css" />
    <link rel="stylesheet" href="/css/hub-chrome.css" />
    <link rel="stylesheet" href="/css/org.css" />
    <link rel="icon" href="/assets/logo.png" type="image/png" />
  </head>
  <body class="hub-site page-jogos">
    <header data-header></header>
    <main class="container">
      <section class="ep-hero ep-hero--plain reveal">
        <div>
          <p class="ep-kicker">Agenda</p>
          <h1>Jogos</h1>
          <p class="ep-lead">Confrontos, resultados, mapas e escalação.</p>
        </div>
      </section>
      <div id="jogos-root"></div>
    </main>
    <footer data-footer></footer>
    <script src="/js/main.js" defer></script>
    <script src="/js/org-ui.js" defer></script>
    <script src="/js/jogos.js" defer></script>
  </body>
</html>
